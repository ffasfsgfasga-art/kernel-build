name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Target Device Codename (e.g. lmi, umi)'
        required: true
        default: 'lmi'
        type: choice
        options:
          - psyche
          - thyme
          - umi
          - munch
          - lmi
          - cmi
          - cas
          - apollo
          - alioth
          - elish
          - enuma
          - dagu
          - pipa

      script:
        description: 'Select Build Script'
        required: true
        default: 'build.sh'
        type: choice
        options:
          - build.sh
          - build-miui.sh

      ksu:
        description: 'Enable KernelSU (ReSukiSU-SuSFS)'
        required: true
        default: true
        type: boolean

jobs:
  build:
    name: Build Kernel for ${{ inputs.device }} (${{ inputs.script }}) (${{ inputs.ksu && 'KSU' || 'NoKSU' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 内核源码
        uses: actions/checkout@v6
        with:
          repository: ffasfsgfasga-art/android_kernel_xiaomi_sm8250
          fetch-depth: 1

      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget bison flex zip bc cpio libssl-dev ccache python3 unzip

      - name: 缓存ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: kernel-ccache-${{ inputs.device }}-${{ github.run_id }}
          restore-keys: |
            kernel-ccache-${{ inputs.device }}-

      - name: 提前准备AnyKernel3
        run: |
          wget https://mirror.ghproxy.com/https://github.com/AstridLabs/AnyKernel3/archive/refs/heads/master.zip -O ak3.zip
          unzip -q ak3.zip
          mv AnyKernel3-master anykernel3
          rm -f ak3.zip

      - name: 执行编译脚本
        run: |
          chmod +x ${{ inputs.script }}
          echo "开始编译，设备：${{ inputs.device }}，脚本：${{ inputs.script }}"
          if [ "${{ inputs.ksu }}" = "true" ]; then
            bash ${{ inputs.script }} ${{ inputs.device }} ksu
          else
            bash ${{ inputs.script }} ${{ inputs.device }}
          fi

      - name: 上传内核刷机包
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-${{ inputs.device }}-${{ inputs.script }}-${{ inputs.ksu && 'KSU' || 'NoKSU' }}-${{ github.run_number }}
          path: ./*.zip
          if-no-files-found: error
